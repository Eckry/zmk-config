# Nombre del teclado visible para hosts USB y Bluetooth (maximo 16 caracteres).
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc BT"

# Soporte opcional de dispositivo apuntador. El scroll suave lo requiere.
# CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Compatibilidad opcional con BIOS/UEFI y entornos de pre-arranque.
# CONFIG_ZMK_USB_BOOT=y

# Entra en reposo tras cinco minutos y en sueño profundo tras una hora.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Mantener la pantalla encendida cuando el teclado entra en reposo.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# CAMBIO: el underglow es el mayor consumo de bateria en un teclado
# inalambrico. Se queda apagado al arrancar; se enciende a mano desde la
# capa SYS (pulgar izquierdo + pulgar derecho, luego RGB_TOG).
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Cambiar el brillo del underglow en pasos de cinco puntos porcentuales.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

# Brillo, tono y saturacion por defecto tras reiniciar la configuracion.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=98

# CAMBIO: necesario para &studio_unlock y para reasignar teclas en vivo
# desde ZMK Studio sin tener que recompilar y flashear.
CONFIG_ZMK_STUDIO=y
